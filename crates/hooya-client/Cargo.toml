[package]
name = "hooya-client"
version = "0.1.2"
edition = "2021"
authors = ["wesl-ee <w@wesl.ee>"]

[[bin]]
name = "hooya"
path = "src/main.rs"

[dependencies]
tonic = { version = "0.11" }
prost = { version = "0.12" }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
hooya = { path = "../../packages/hooya" }
hooya-config = { path = "../../packages/hooya-config" }
semver = "1.0"
clap = { version = "4.3", features = ["env", "cargo"] }
anyhow = "1.0"
dotenv = "0.15"