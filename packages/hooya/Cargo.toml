[package]
name = "hooya"
version = "0.1.2"
edition = "2021"
authors = [ "wesl-ee <w@wesl.ee>" ]

[dependencies]
tonic = { version = "0.11" }
prost = { version = "0.12" }
cid = "0.10"
ring = "0.16"
tokio = { version = "1.0", features = [ "macros", "rt-multi-thread"] }
sqlx = { version = "0.6", features = [ "runtime-tokio-native-tls", "sqlite" ] }
anyhow = "1.0"
infer = "0.14"
futures-util = "0.3"
image = "0.25"
kamadak-exif = "0.5"
serde = { version = "1.0", features = [ "derive" ] }
sylow = "0.1.0"
multibase = "0.9"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
hooya-config = { path = "../hooya-config" }
libp2p = { version = "0.53", features = ["gossipsub", "identify", "ping", "tcp", "tokio", "macros", "dns", "mdns"] }
trust-dns-resolver = "0.23"
futures = "0.3"
discv5 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rev_lines = "0.3"
toml = "0.8"
tracing = "0.1"

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
tempfile = "3.8"
